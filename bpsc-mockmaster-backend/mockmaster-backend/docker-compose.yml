# Local development stack. Not a production deployment.
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: mockmaster, POSTGRES_PASSWORD: change-me, POSTGRES_DB: mockmaster }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
  api:
    build: .
    env_file: .env
    environment: { DATABASE_URL: "postgres://mockmaster:change-me@postgres:5432/mockmaster", REDIS_URL: "redis://redis:6379" }
    depends_on: [postgres, redis]
    ports: ["8080:8080"]
  worker:
    build: .
    command: ["node", "dist/src/worker.js"]
    env_file: .env
    environment: { DATABASE_URL: "postgres://mockmaster:change-me@postgres:5432/mockmaster", REDIS_URL: "redis://redis:6379" }
    depends_on: [postgres, redis]
volumes: { pgdata: {} }
